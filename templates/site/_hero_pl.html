{# 3k · The Face: split hero (kicker, h1, beat, booking and team doors, lead frame).
   Included by site/specialty.html (plan R-4); renders in that page's context. -#}
<section class="sr-wrap" aria-label="Portrait sessions">
  <div class="sr-herosplit">
    <div class="sr-herosplit-copy">
      <span class="sr-mono sr-mono--stock">{{ page.kicker }}</span>
      <h1>{{ page.h1a }}<br><em>{{ page.h1b }}</em></h1>
      <p class="sr-beat">{{ page.sr.beat }}</p>
      <div class="sr-herosplit-actions">
        <a class="sr-btn" href="{{ book_url }}">{{ page.sr.cta }} &rarr;</a>
        <a class="sr-btn sr-btn--ghost" href="/contact?service={{ page.contact_service|urlencode }}&amp;tier={{ page.sr.team_tier|urlencode }}">{{ page.sr.team_cta }} &rarr;</a>
      </div>
    </div>
    <figure class="sr-herosplit-fig">
      {% if photos %}
      <img src="{{ hero_image.web.url }}" decoding="async"
           {% if hero_image.available %}fetchpriority="high"{% else %}loading="lazy"{% endif %}
           {% if hero_image.web.width %}width="{{ hero_image.web.width }}" height="{{ hero_image.web.height }}"{% endif %}
           {% if hero_image.srcset %}srcset="{{ hero_image.srcset }}"
           sizes="(max-width: 1000px) 100vw, 560px"{% endif %}
           alt="{{ photos[0]|portfolio_alt }}">
      {% endif %}
      <span class="sr-frameno">{{ sp.stock }}{% if photos %} &middot; FR&middot;{{ "%04d"|format(photos[0].id) }}{% endif %} &mdash; {{ page.hero_caption }}</span>
    </figure>
  </div>
</section>
