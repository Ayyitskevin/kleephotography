# Declares the supported Python only — Mise deploys from a git checkout and is
# never built or published, so there is no [build-system] and the version is
# nominal.
[project]
name = "mise"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
# Oldest Python we support (matches requires-python). CI runs 3.14; ruff's
# target-version is a floor for syntax/upgrade rules, not the runtime.
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = [
  "E501",   # long lines OK for SQL strings, template paths, and descriptive text
  "W291",   # trailing whitespace (some legacy)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/smoke/*" = ["E401", "UP017", "E731", "F401", "F841", "UP012"]

[tool.coverage.report]
# The integration and smoke steps accumulate into one data file, and this floor
# is checked once against that union — 80% of app/ measured, two points of slack
# so an unlucky ordering doesn't turn main red. It has to be checked on the union
# because neither step clears it alone (integration 47%, smoke 72%), which is why
# the integration step passes --cov-fail-under=0.
fail_under = 78
